[package]
name = "moj-sint"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Headless real-time synthesizer core for SHR-DAW"
repository = "https://github.com/PaolaShultz/moj-sint"

[lib]
name = "moj_sint"

[[bin]]
name = "moj-sint"
path = "src/main.rs"

[dependencies]
alsa = "0.7.1"
anyhow = "1"
hound = "3.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_no_alloc = "1.1"
tempfile = "3"
